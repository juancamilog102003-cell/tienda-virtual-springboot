<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-5">
      <h1>Tienda</h1>
    </div>

    <div class="container mt-5">
        <h2>Productos </h2>
        <table class="table">
            <thead>
                <tr>
                    <th>id</th>
                    <th>nombre</th>
                    <th>descripcion</th>
                    <th>precio</th>
                    <th>stock</th>
                    <th>marca</th>
                    <th>imagen</th>
                    <th>tipo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}">1</td>
                    <td th:text="${producto.nombre}">nombre del producto</td>
                    <td th:text="${producto.descripcion}">descripcion</td>
                    <td th:text="${producto.precio}">precio</td>
                    <td th:text="${producto.stock} ">stock</td>
                    <td th:text="${producto.marca}">marca</td>
                    <td>
                           <img th:src="${producto.imagenUrl}" 
                           alt="producto"
                            width="100"
                            class="img-fluid rounded shadow-sm">
                    </td> 
                    <td th:text="${producto.tipoProducto}">tipo</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
