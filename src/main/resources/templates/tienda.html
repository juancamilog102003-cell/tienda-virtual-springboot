<!doctype html>
<!--
  xmlns:th  ->  activa las etiquetas de Thymeleaf en el HTML.
  lang="es" ->  idioma español.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda</title>
    <!-- Bootstrap 5 desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body style="background-color: #1e1e2f; color: white;">

    <div class="container mt-5">

      <!-- ========== ENCABEZADO ========== -->
      <div class="text-center mb-5">
        <!--
          Mensaje de bienvenida para el cliente.
          session.usuario  ->  objeto Usuario guardado en la sesión
                               durante el inicio de sesión.
          ${session.usuario.nombre}  ->  muestra el nombre del cliente
                                          que inició sesión.
        -->
        <h1 class="mb-3">Bienvenido, <span th:text="${session.usuario.nombre}">Cliente</span></h1>
        <p class="lead">Estos son nuestros productos disponibles:</p>

        <!--
          Enlace para ir al carrito de compras.
          th:href="@{/carrito}"  ->  llama al método mostrarCarrito del
                                     controlador, que muestra la vista
                                     carrito.html con los productos.
        -->
        <a th:href="@{/carrito}" class="btn btn-success me-2">Mi Carrito</a>
        <a th:href="@{/mis-favoritos}" class="btn btn-warning me-2">Mis Favoritos</a>
        <a th:href="@{/mis-compras}" class="btn btn-info me-2">Mis Compras</a>

        <!--
          Enlace para cerrar sesión.
          th:href="@{/logout}"  ->  llama al método cerrarSesion del
                                    controlador, que invalida la sesión
                                    y redirige al login.
        -->
        <a th:href="@{/logout}" class="btn btn-danger">Cerrar Sesión</a>
      </div>

      <!-- ========== LISTA DE PRODUCTOS ========== -->
      <!--
        th:each="producto : ${productos}"  ->  recorre la lista de productos
        que el controlador agregó al modelo con el nombre "productos".

        row-cols-1 row-cols-md-2 row-cols-lg-3  ->  responsive:
          - 1 columna en móviles
          - 2 columnas en tablets (md)
          - 3 columnas en escritorio (lg)
      -->
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

        <div th:each="producto : ${productos}" class="col">
          <div class="card h-100 text-white bg-dark">

            <!-- Imagen del producto (si tiene) -->
            <img th:if="${producto.imagenUrl != null and !producto.imagenUrl.isEmpty()}"
                 th:src="${producto.imagenUrl}"
                 alt="Imagen del producto"
                 class="card-img-top"
                 style="height: 200px; object-fit: cover;">

            <div class="card-body d-flex flex-column">

              <!-- Nombre del producto -->
              <h5 class="card-title" th:text="${producto.nombre}">Nombre</h5>

              <!-- Marca -->
              <h6 class="card-subtitle mb-2 text-secondary" th:text="${producto.marca}">Marca</h6>

              <!-- Descripción -->
              <p class="card-text flex-grow-1" th:text="${producto.descripcion}">Descripción</p>

              <!-- Precio -->
              <p class="card-text mt-auto">
                <span class="badge bg-success fs-6">$<span th:text="${producto.precio}">0.00</span></span>
              </p>

              <!--
                Botón "Agregar al carrito".
                th:action="@{'/carrito/agregar/' + ${producto.id}}"  ->
                  genera una URL como /carrito/agregar/3 para el producto con id=3.
                method="post"  ->  envía los datos por POST (no por GET).
                Al hacer clic, el controlador UsuarioController.agregarAlCarrito()
                procesa la solicitud y redirige de nuevo a la tienda.
              -->
              <form th:action="@{'/carrito/agregar/' + ${producto.id}}" method="post" class="mt-2">
                <button type="submit" class="btn btn-primary w-100">Agregar al carrito</button>
              </form>

              <!--
                Botón "Agregar a Favoritos".
                th:action="@{'/favoritos/agregar/' + ${producto.id}}"  ->
                  genera una URL como /favoritos/agregar/3 para el producto con id=3.
                method="post"  ->  envía los datos por POST.
                Al hacer clic, el controlador UsuarioController.agregarFavorito()
                procesa la solicitud y redirige de nuevo a la tienda.
              -->
              <form th:action="@{'/favoritos/agregar/' + ${producto.id}}" method="post" class="mt-2">
                <button type="submit" class="btn btn-outline-danger w-100">Agregar a Favoritos</button>
              </form>

            </div>
          </div>
        </div>

      </div>

      <!-- Mensaje si no hay productos -->
      <div th:if="${#lists.isEmpty(productos)}" class="text-center mt-5">
        <p class="text-secondary">No hay productos disponibles en este momento.</p>
      </div>

    </div>

  </body>
</html>
